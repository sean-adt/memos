"name": "ADT publish test image"
"on": {"push": {"branches": ["release"]}}
"permissions": {"contents": "read"}
"concurrency": {"group": "publish-test-image", "cancel-in-progress": false}
jobs:
  validate: {"name": "ADT validation", "runs-on": "ubuntu-24.04", "timeout-minutes": 90, "steps": [{"uses": "actions/checkout@v6", "with": {"persist-credentials": false}}, {"uses": "actions/setup-python@v6", "with": {"python-version": "3.13"}}, {"uses": "actions/setup-go@v6", "with": {"go-version": "1.27.0"}}, {"uses": "pnpm/action-setup@v4", "with": {"version": "11.0.1", "package_json_file": "web/package.json"}}, {"uses": "actions/setup-node@v6", "with": {"node-version": "24.21.0"}}, {"name": "Run project checks", "run": "python3 .adt/test.py"}, {"name": "Build source image", "run": "python3 .adt/runtime.py build --image adt-validation:ci"}, {"name": "Verify container and dependencies", "run": "python3 .adt/runtime.py smoke --image adt-validation:ci"}, {"name": "Clean disposable resources", "if": "always()", "run": "python3 .adt/runtime.py cleanup"}, {"name": "Export verified image", "id": "export", "run": "python3 - <<'PY'\nimport hashlib, json, os, subprocess\nfrom pathlib import Path\nout = Path(os.environ['RUNNER_TEMP']) / 'adt-artifact'\nout.mkdir()\narchive = out / 'image.tar'\nsubprocess.run(['docker', 'save', '-o', str(archive), 'adt-validation:ci'], check=True)\nwith archive.open('rb') as stream:\n    checksum = hashlib.file_digest(stream, 'sha256').hexdigest()\nimage_id = subprocess.check_output(['docker', 'image', 'inspect', 'adt-validation:ci', '--format', '{{.Id}}'], text=True).strip()\n(out / 'manifest.json').write_text(json.dumps({'version': 1, 'source': os.environ['GITHUB_SHA'],\n    'repository': os.environ['GITHUB_REPOSITORY'], 'repo_id': os.environ['GITHUB_REPOSITORY_ID'],\n    'workflow': os.environ['GITHUB_WORKFLOW_REF'], 'job': os.environ['GITHUB_JOB'],\n    'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'run': os.environ['GITHUB_RUN_ID'],\n    'image_id': image_id, 'sha256': checksum}))\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as stream:\n    stream.write('attempt=' + os.environ['GITHUB_RUN_ATTEMPT'] + '\\n')\nPY"}, {"uses": "actions/upload-artifact@v4", "id": "artifact", "with": {"name": "adt-image-${{ github.sha }}-${{ github.run_attempt }}", "path": "${{ runner.temp }}/adt-artifact/", "retention-days": 7, "if-no-files-found": "error", "compression-level": 0}}], "outputs": {"artifact": "${{ steps.artifact.outputs.artifact-id }}", "attempt": "${{ steps.export.outputs.attempt }}"}}
  publish:
    needs: "validate"
    runs-on: "adt-org-runner"
    timeout-minutes: 30
    env: {"IMAGE": "registry.10.68.12.170.nip.io/sean-adt/memos/app", "GH_TOKEN": "${{ github.token }}", "VALIDATION_ATTEMPT": "${{ needs.validate.outputs.attempt }}"}
    steps:
      - {"uses": "actions/setup-python@v6", "with": {"python-version": "3.13"}}
      - {"uses": "actions/download-artifact@v4", "with": {"artifact-ids": "${{ needs.validate.outputs.artifact }}", "merge-multiple": true, "path": "${{ runner.temp }}/adt-artifact"}}
      - {"name": "Verify and load validated image", "run": "python3 - <<'PY'\nimport hashlib, json, os, re, subprocess\nfrom pathlib import Path\nout = Path(os.environ['RUNNER_TEMP']) / 'adt-artifact'\nmanifest = json.loads((out / 'manifest.json').read_text())\nif not (manifest.get('version') == 1 and manifest.get('source') == os.environ['GITHUB_SHA']\n        and manifest.get('repository') == os.environ['GITHUB_REPOSITORY']\n        and manifest.get('run') == os.environ['GITHUB_RUN_ID']\n        and manifest.get('repo_id') == os.environ['GITHUB_REPOSITORY_ID']\n        and manifest.get('workflow') == os.environ['GITHUB_WORKFLOW_REF']\n        and manifest.get('job') == 'validate'\n        and manifest.get('attempt') == os.environ['VALIDATION_ATTEMPT']\n        and re.fullmatch(r'sha256:[0-9a-f]{64}', manifest.get('image_id', ''))):\n    raise SystemExit('ADT: artifact provenance mismatch')\narchive = out / 'image.tar'\nwith archive.open('rb') as stream:\n    checksum = hashlib.file_digest(stream, 'sha256').hexdigest()\nif checksum != manifest.get('sha256'):\n    raise SystemExit('ADT: artifact checksum mismatch')\n\"\"\"Portable Docker-save identity, independent of daemon-local image IDs.\"\"\"\nimport gzip\nimport hashlib\nimport io\nimport json\nimport re\nfrom pathlib import PurePosixPath\nimport tarfile\n\n\ndef archive_identity(path):\n    \"\"\"Read only regular members; never extract or execute an image.\"\"\"\n    with tarfile.open(path, 'r:*') as archive:\n        members = archive.getmembers()\n        names = [m.name.rstrip('/') for m in members]\n        if len(names) != len(set(names)):\n            raise ValueError('Duplicate image archive members')\n        for member in members:\n            name = PurePosixPath(member.name)\n            if name.is_absolute() or '..' in name.parts or str(name) != member.name.rstrip('/') or not (member.isfile() or member.isdir()):\n                raise ValueError('Unsafe image archive member')\n\n        def regular(name, maximum=None):\n            member = archive.getmember(name)\n            if not member.isfile() or (maximum is not None and member.size > maximum):\n                raise ValueError('Invalid image metadata member')\n            return archive.extractfile(member)\n\n        with regular('manifest.json', 1024*1024) as stream:\n            manifest = json.load(stream)\n        if (not isinstance(manifest, list) or len(manifest) != 1\n                or manifest[0].get('RepoTags') != ['adt-validation:ci']):\n            raise ValueError('Expected exactly the validated image tag')\n        image = manifest[0]\n        with regular(image['Config'], 4*1024*1024) as stream:\n            config_bytes = stream.read()\n        config = json.loads(config_bytes)\n        rootfs = config.get('rootfs', {})\n        layers = image.get('Layers')\n        expected = rootfs.get('diff_ids')\n        if (rootfs.get('type') != 'layers' or not isinstance(layers, list)\n                or not isinstance(expected, list) or len(layers) != len(expected)):\n            raise ValueError('Invalid image root filesystem identity')\n        actual, raw_layers = [], []\n        for name in layers:\n            with regular(name) as stream:\n                raw_layers.append({'digest':'sha256:'+hashlib.file_digest(stream, 'sha256').hexdigest(),\n                                   'size':archive.getmember(name).size})\n            with regular(name) as stream:\n                buffered = io.BufferedReader(stream)\n                # Docker stores can export gzip-compressed or plain layer tars.\n                content = gzip.GzipFile(fileobj=buffered) if buffered.peek(2)[:2] == b'\\x1f\\x8b' else buffered\n                digest = hashlib.file_digest(content, 'sha256').hexdigest()\n                actual.append('sha256:'+digest)\n        if actual != expected:\n            raise ValueError('Image layer content differs from configuration')\n        config_digest = 'sha256:'+hashlib.sha256(config_bytes).hexdigest()\n        if 'index.json' in names:\n            with regular('index.json', 1024*1024) as stream:\n                index = json.load(stream)\n            descriptors = index.get('manifests', [])\n            if index.get('schemaVersion') != 2 or len(descriptors) != 1:\n                raise ValueError('Expected one OCI image descriptor')\n            descriptor = descriptors[0]\n            annotations = descriptor.get('annotations', {})\n            allowed_names = {\n                'io.containerd.image.name': ('adt-validation:ci', 'docker.io/library/adt-validation:ci'),\n                'org.opencontainers.image.ref.name': ('ci', 'adt-validation:ci', 'docker.io/library/adt-validation:ci'),\n            }\n            if any(key in annotations and annotations[key] not in allowed for key, allowed in allowed_names.items()):\n                raise ValueError('OCI image tag differs from validated tag')\n            digest = descriptor.get('digest', '')\n            if (descriptor.get('mediaType') not in ('application/vnd.oci.image.manifest.v1+json',\n                    'application/vnd.docker.distribution.manifest.v2+json')\n                    or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest)):\n                raise ValueError('Unsupported OCI image descriptor')\n            with regular('blobs/sha256/'+digest[7:], 1024*1024) as stream:\n                metadata = stream.read()\n            if len(metadata) != descriptor.get('size') or 'sha256:'+hashlib.sha256(metadata).hexdigest() != digest:\n                raise ValueError('OCI manifest content changed')\n            oci = json.loads(metadata)\n            if (image['Config'] != 'blobs/sha256/'+config_digest[7:]\n                    or layers != ['blobs/sha256/'+entry['digest'][7:] for entry in raw_layers]):\n                raise ValueError('OCI blobs differ from Docker archive members')\n            if (oci.get('schemaVersion') != 2 or oci.get('config', {}).get('digest') != config_digest\n                    or oci['config'].get('size') != len(config_bytes)\n                    or [{'digest':x.get('digest'), 'size':x.get('size')} for x in oci.get('layers', [])] != raw_layers):\n                raise ValueError('OCI descriptor differs from Docker archive identity')\n        return {'config': 'sha256:'+hashlib.sha256(config_bytes).hexdigest(), 'layers': actual}\n\nexpected = archive_identity(archive)\nsubprocess.run(['docker', 'load', '-i', str(archive)], check=True)\nlocal_id = subprocess.check_output(['docker', 'image', 'inspect', 'adt-validation:ci', '--format', '{{.Id}}'], text=True).strip()\nimport tempfile\nwith tempfile.TemporaryDirectory(prefix='adt-loaded-', dir=os.environ['RUNNER_TEMP']) as temporary:\n    loaded = Path(temporary) / 'loaded.tar'\n    subprocess.run(['docker', 'save', '-o', str(loaded), 'adt-validation:ci'], check=True)\n    observed = archive_identity(loaded)\nif observed != expected:\n    raise SystemExit('ADT: loaded image content differs from validated image')\nif subprocess.check_output(['docker', 'image', 'inspect', 'adt-validation:ci', '--format', '{{.Id}}'], text=True).strip() != local_id:\n    raise SystemExit('ADT: loaded image tag changed during verification')\nprint('ADT: verified portable image configuration ' + expected['config'])\nsubprocess.run(['docker', 'tag', local_id, os.environ['IMAGE'] + ':' + os.environ['GITHUB_SHA']], check=True)\nPY"}
      - name: Push verified image
        run: docker push "$IMAGE:$GITHUB_SHA"
      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          repository: sean-lpx/autonomous-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Update test deployment image
        shell: bash
        working-directory: gitops
        run: |
          set -euo pipefail
          latest_release="$(python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/release', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)['object']['sha'])
          PY
          )"
          test -n "$latest_release"
          if [ "$latest_release" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded release: $GITHUB_SHA"
            exit 0
          fi
          published_ref="$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          export IMAGE_DIGEST="${published_ref##*@}"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("apps/sean-adt-memos-39070bfc/overlays/test/kustomization.yaml")
          original = path.read_text()
          updated, count = re.subn(r"(?m)^([ \t]*digest:[ \t]*)sha256:[0-9a-f]{64}[ \t]*$",
                                  lambda m: m.group(1) + os.environ['IMAGE_DIGEST'], original)
          if count != 1:
              raise SystemExit('Expected exactly one image digest')
          path.write_text(updated)
          PY
          file="apps/sean-adt-memos-39070bfc/overlays/test/kustomization.yaml"
          if git diff --quiet -- "$file"; then
            echo "GitOps already references this image."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          git commit -m "deploy(memos): ${GITHUB_SHA}" -m "Source: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Other projects may update this shared branch at the same time.
          # Rebase preserves their unrelated paths; a conflict stops publication.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Clean downloaded artifact
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/adt-artifact"

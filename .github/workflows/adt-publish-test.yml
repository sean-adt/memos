"name": "ADT publish test image"
"on": {"push": {"branches": ["release"]}}
"permissions": {"contents": "read", "actions": "read", "pull-requests": "read"}
"concurrency": {"group": "publish-test-image", "cancel-in-progress": false}
jobs:
  select: {"name": "Select verified PR image", "runs-on": "ubuntu-24.04", "timeout-minutes": 5, "env": {"GH_TOKEN": "${{ github.token }}", "ADT_BASE": "release"}, "outputs": {"reuse": "${{ steps.select.outputs.reuse }}", "tree": "${{ steps.select.outputs.tree }}", "source": "${{ steps.select.outputs.source }}", "run": "${{ steps.select.outputs.run }}", "attempt": "${{ steps.select.outputs.attempt }}", "artifact": "${{ steps.select.outputs.artifact }}", "head": "${{ steps.select.outputs.head }}", "pr": "${{ steps.select.outputs.pr }}", "workflow": "${{ steps.select.outputs.workflow }}"}, "steps": [{"uses": "actions/setup-python@v6", "with": {"python-version": "3.13"}}, {"name": "Match PR artifact to release source", "id": "select", "run": "python3 - <<'PY'\n\"\"\"Read-only GitHub selection for generated v6 workflows; no business-code execution.\"\"\"\nimport json\nimport os\nimport re\nimport urllib.error\nimport urllib.request\n\nWORKFLOW = '.github/workflows/adt-validation.yml'\nSHA = r'[0-9a-f]{40}'\n\n\ndef require(value, message):\n    if not value:\n        raise ValueError('ADT: ' + message)\n\n\ndef select(api, repo, repo_id, release, base):\n    root = 'repos/' + repo\n    tree = api(root + '/git/commits/' + release)['tree']['sha']\n    require(re.fullmatch(SHA, tree), 'invalid release tree')\n    fallback = {'reuse': 'false', 'tree': tree}\n    prs = api(root + '/commits/' + release + '/pulls?per_page=100')\n    require(isinstance(prs, list) and len(prs) < 100, 'ambiguous release PR listing')\n    matches = [p for p in prs if p.get('merged_at') and p.get('merge_commit_sha') == release\n               and p['base']['ref'] == base and p['base']['repo']['id'] == repo_id\n               and (p['head'].get('repo') or {}).get('id') == repo_id]\n    require(len(matches) <= 1, 'multiple merged PRs for release')\n    if not matches:\n        return dict(fallback, reason='No matching merged same-repository PR')\n    pr = api(root + '/pulls/' + str(matches[0]['number']))\n    require(pr.get('merged') is True and pr.get('merge_commit_sha') == release\n            and pr['base']['ref'] == base and pr['base']['repo']['id'] == repo_id\n            and (pr['head'].get('repo') or {}).get('id') == repo_id, 'merged PR provenance changed')\n    head = pr['head']['sha']\n    require(re.fullmatch(SHA, head), 'invalid PR head')\n    data = api(root + '/actions/workflows/adt-validation.yml/runs?event=pull_request&head_sha=' + head + '&per_page=100')\n    require(data['total_count'] <= 100, 'incomplete validation run listing')\n    runs = sorted(data['workflow_runs'], key=lambda r: r['id'], reverse=True)\n    for run in runs:\n        if not (run.get('event') == 'pull_request' and run.get('path') == WORKFLOW\n                and run.get('head_sha') == head and run.get('status') == 'completed'\n                and run.get('conclusion') == 'success'\n                and (run.get('repository') or {}).get('id') == repo_id\n                and (run.get('head_repository') or {}).get('id') == repo_id\n                and any(p.get('number') == pr['number']\n                        and p.get('base', {}).get('ref') == base\n                        and p.get('base', {}).get('repo', {}).get('id') == repo_id\n                        and p.get('head', {}).get('sha') == head\n                        and p.get('head', {}).get('repo', {}).get('id') == repo_id\n                        for p in run.get('pull_requests', []))):\n            continue\n        run_id, attempt = run['id'], run['run_attempt']\n        require(type(run_id) is int and run_id > 0 and type(attempt) is int and attempt > 0,\n                'invalid validation run identity')\n        artifacts = api(root + f'/actions/runs/{run_id}/artifacts?per_page=100')\n        require(artifacts['total_count'] <= 100, 'incomplete validation artifact listing')\n        pattern = 'adt-image-' + tree + '-(' + SHA + ')-' + str(run_id) + '-' + str(attempt)\n        matches = [(a, re.fullmatch(pattern, a.get('name', ''))) for a in artifacts['artifacts']]\n        matches = [(a, m) for a, m in matches if m and not a.get('expired')]\n        require(len(matches) <= 1, 'multiple matching validation artifacts')\n        if not matches:\n            continue\n        artifact, match = matches[0]\n        producing = artifact.get('workflow_run') or {}\n        require(producing.get('id') == run_id and producing.get('repository_id') == repo_id\n                and producing.get('head_repository_id') == repo_id and producing.get('head_sha') == head,\n                'artifact producer differs from validation run')\n        require(type(artifact.get('id')) is int and artifact['id'] > 0\n                and re.fullmatch(r'sha256:[0-9a-f]{64}', artifact.get('digest', '')),\n                'invalid artifact identity')\n        source = match.group(1)\n        # A PR checkout is normally a synthetic merge commit, not run.head_sha.\n        try:\n            tested = api(root + '/git/commits/' + source)\n        except urllib.error.HTTPError as error:\n            if error.code == 404:\n                continue  # GitHub may have pruned the synthetic commit; rebuild safely.\n            raise\n        require(tested['tree']['sha'] == tree, 'artifact name disagrees with tested source tree')\n        require(source == head or head in [p['sha'] for p in tested.get('parents', [])],\n                'tested source is not the PR head or its merge')\n        return {'reuse': 'true', 'tree': tree, 'source': source, 'run': str(run_id),\n                'attempt': str(attempt), 'artifact': str(artifact['id']), 'head': head,\n                'pr': str(pr['number']), 'workflow': repo + '/' + WORKFLOW + '@refs/pull/' + str(pr['number']) + '/merge',\n                'reason': 'Reusing verified PR image'}\n    return dict(fallback, reason='No available successful PR artifact for the release tree')\n\n\ndef main():\n    api_url = os.environ['GITHUB_API_URL'].rstrip('/')\n    def api(path):\n        request = urllib.request.Request(api_url + '/' + path, headers={\n            'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],\n            'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})\n        with urllib.request.urlopen(request, timeout=30) as response:\n            return json.load(response)\n    result = select(api, os.environ['GITHUB_REPOSITORY'], int(os.environ['GITHUB_REPOSITORY_ID']),\n                    os.environ['GITHUB_SHA'], os.environ['ADT_BASE'])\n    print('[ARTIFACT] ' + result.pop('reason'), flush=True)\n    with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:\n        for key, value in result.items():\n            require('\\n' not in value and '\\r' not in value, 'invalid workflow output')\n            stream.write(key + '=' + value + '\\n')\n\n\nif __name__ == '__main__':\n    main()\n\nPY"}]}
  validate: {"name": "ADT validation", "runs-on": "ubuntu-24.04", "timeout-minutes": 90, "steps": [{"uses": "actions/checkout@v6", "with": {"persist-credentials": false}}, {"uses": "actions/setup-python@v6", "with": {"python-version": "3.13"}}, {"uses": "actions/setup-go@v6", "with": {"go-version": "1.27.0"}}, {"uses": "pnpm/action-setup@v4", "with": {"version": "11.0.1", "package_json_file": "web/package.json"}}, {"uses": "actions/setup-node@v6", "with": {"node-version": "24.21.0"}}, {"name": "Run project checks", "run": "python3 .adt/test.py"}, {"name": "Build source image", "run": "python3 .adt/runtime.py build --image adt-validation:ci"}, {"name": "Verify container and dependencies", "run": "python3 .adt/runtime.py smoke --image adt-validation:ci"}, {"name": "Clean disposable resources", "if": "always()", "run": "python3 .adt/runtime.py cleanup"}, {"name": "Export verified image", "id": "export", "run": "python3 - <<'PY'\nimport hashlib, json, os, subprocess\nfrom pathlib import Path\nout = Path(os.environ['RUNNER_TEMP']) / 'adt-artifact'\nout.mkdir()\nsubprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)\nsource = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()\ntree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()\nif source != os.environ['GITHUB_SHA']:\n    raise SystemExit('ADT: validation checkout differs from event source')\nevent = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())\npr = event.get('pull_request') or {}\narchive = out / 'image.tar'\nsubprocess.run(['docker', 'save', '-o', str(archive), 'adt-validation:ci'], check=True)\nwith archive.open('rb') as stream:\n    checksum = hashlib.file_digest(stream, 'sha256').hexdigest()\nimage_id = subprocess.check_output(['docker', 'image', 'inspect', 'adt-validation:ci', '--format', '{{.Id}}'], text=True).strip()\n(out / 'manifest.json').write_text(json.dumps({'version': 2, 'source': source, 'tree': tree,\n    'repository': os.environ['GITHUB_REPOSITORY'], 'repo_id': os.environ['GITHUB_REPOSITORY_ID'],\n    'workflow': os.environ['GITHUB_WORKFLOW_REF'], 'job': os.environ['GITHUB_JOB'],\n    'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'run': os.environ['GITHUB_RUN_ID'],\n    'event': os.environ['GITHUB_EVENT_NAME'], 'pr': str(pr.get('number', '')),\n    'base_ref': pr.get('base', {}).get('ref', os.environ['GITHUB_REF_NAME']),\n    'head': pr.get('head', {}).get('sha', source), 'image_id': image_id, 'sha256': checksum}))\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as stream:\n    for key, value in {'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'source': source, 'tree': tree,\n        'name': 'adt-image-' + tree + '-' + source + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']}.items():\n        stream.write(key + '=' + value + '\\n')\nPY"}, {"uses": "actions/upload-artifact@v4", "id": "artifact", "with": {"name": "${{ steps.export.outputs.name }}", "path": "${{ runner.temp }}/adt-artifact/", "retention-days": 7, "if-no-files-found": "error", "compression-level": 0}}], "outputs": {"artifact": "${{ steps.artifact.outputs.artifact-id }}", "attempt": "${{ steps.export.outputs.attempt }}"}, "needs": "select", "if": "${{ needs.select.outputs.reuse != 'true' }}"}
  publish:
    needs: ["select", "validate"]
    runs-on: "adt-org-runner"
    timeout-minutes: 30
    env: {"IMAGE": "registry.10.68.12.170.nip.io/sean-adt/memos/app", "GH_TOKEN": "${{ github.token }}", "VALIDATION_ATTEMPT": "${{ needs.select.outputs.reuse == 'true' && needs.select.outputs.attempt || needs.validate.outputs.attempt }}", "PRODUCER_RUN": "${{ needs.select.outputs.reuse == 'true' && needs.select.outputs.run || github.run_id }}", "PRODUCER_SOURCE": "${{ needs.select.outputs.reuse == 'true' && needs.select.outputs.source || github.sha }}", "PRODUCER_TREE": "${{ needs.select.outputs.tree }}", "PRODUCER_BASE": "release", "PRODUCER_WORKFLOW": "${{ needs.select.outputs.reuse == 'true' && needs.select.outputs.workflow || github.workflow_ref }}", "PRODUCER_EVENT": "${{ needs.select.outputs.reuse == 'true' && 'pull_request' || 'push' }}", "PRODUCER_PR": "${{ needs.select.outputs.reuse == 'true' && needs.select.outputs.pr || '' }}", "PRODUCER_HEAD": "${{ needs.select.outputs.reuse == 'true' && needs.select.outputs.head || github.sha }}"}
    if: "${{ always() && !cancelled() && needs.select.result == 'success' && (needs.select.outputs.reuse == 'true' || needs.validate.result == 'success') }}"
    steps:
      - {"uses": "actions/setup-python@v6", "with": {"python-version": "3.13"}}
      - {"name": "Download verified image", "uses": "actions/download-artifact@v4", "with": {"artifact-ids": "${{ needs.select.outputs.reuse == 'true' && needs.select.outputs.artifact || needs.validate.outputs.artifact }}", "run-id": "${{ needs.select.outputs.reuse == 'true' && needs.select.outputs.run || github.run_id }}", "github-token": "${{ github.token }}", "merge-multiple": true, "path": "${{ runner.temp }}/adt-artifact"}}
      - {"name": "Verify and load PR or release image", "run": "python3 - <<'PY'\nimport hashlib, json, os, re, subprocess\nfrom pathlib import Path\nout = Path(os.environ['RUNNER_TEMP']) / 'adt-artifact'\nmanifest = json.loads((out / 'manifest.json').read_text())\nexpected_fields = {'version': 2, 'source': os.environ['PRODUCER_SOURCE'], 'tree': os.environ['PRODUCER_TREE'],\n    'repository': os.environ['GITHUB_REPOSITORY'], 'repo_id': os.environ['GITHUB_REPOSITORY_ID'],\n    'workflow': os.environ['PRODUCER_WORKFLOW'], 'job': 'validate',\n    'run': os.environ['PRODUCER_RUN'], 'attempt': os.environ['VALIDATION_ATTEMPT'],\n    'event': os.environ['PRODUCER_EVENT'], 'pr': os.environ['PRODUCER_PR'], 'head': os.environ['PRODUCER_HEAD'],\n    'base_ref': os.environ['PRODUCER_BASE']}\nif any(manifest.get(key) != value for key, value in expected_fields.items()):\n    raise SystemExit('ADT: artifact provenance mismatch')\nif not re.fullmatch(r'sha256:[0-9a-f]{64}', manifest.get('image_id', '')):\n    raise SystemExit('ADT: invalid producer image identity')\narchive = out / 'image.tar'\nwith archive.open('rb') as stream:\n    checksum = hashlib.file_digest(stream, 'sha256').hexdigest()\nif checksum != manifest.get('sha256'):\n    raise SystemExit('ADT: artifact checksum mismatch')\n\"\"\"Portable Docker-save identity, independent of daemon-local image IDs.\"\"\"\nimport gzip\nimport hashlib\nimport io\nimport json\nimport re\nfrom pathlib import PurePosixPath\nimport tarfile\n\n\ndef archive_identity(path):\n    \"\"\"Read only regular members; never extract or execute an image.\"\"\"\n    with tarfile.open(path, 'r:*') as archive:\n        members = archive.getmembers()\n        names = [m.name.rstrip('/') for m in members]\n        if len(names) != len(set(names)):\n            raise ValueError('Duplicate image archive members')\n        for member in members:\n            name = PurePosixPath(member.name)\n            if name.is_absolute() or '..' in name.parts or str(name) != member.name.rstrip('/') or not (member.isfile() or member.isdir()):\n                raise ValueError('Unsafe image archive member')\n\n        def regular(name, maximum=None):\n            member = archive.getmember(name)\n            if not member.isfile() or (maximum is not None and member.size > maximum):\n                raise ValueError('Invalid image metadata member')\n            return archive.extractfile(member)\n\n        with regular('manifest.json', 1024*1024) as stream:\n            manifest = json.load(stream)\n        if (not isinstance(manifest, list) or len(manifest) != 1\n                or manifest[0].get('RepoTags') != ['adt-validation:ci']):\n            raise ValueError('Expected exactly the validated image tag')\n        image = manifest[0]\n        with regular(image['Config'], 4*1024*1024) as stream:\n            config_bytes = stream.read()\n        config = json.loads(config_bytes)\n        rootfs = config.get('rootfs', {})\n        layers = image.get('Layers')\n        expected = rootfs.get('diff_ids')\n        if (rootfs.get('type') != 'layers' or not isinstance(layers, list)\n                or not isinstance(expected, list) or len(layers) != len(expected)):\n            raise ValueError('Invalid image root filesystem identity')\n        actual, raw_layers = [], []\n        for name in layers:\n            with regular(name) as stream:\n                raw_layers.append({'digest':'sha256:'+hashlib.file_digest(stream, 'sha256').hexdigest(),\n                                   'size':archive.getmember(name).size})\n            with regular(name) as stream:\n                buffered = io.BufferedReader(stream)\n                # Docker stores can export gzip-compressed or plain layer tars.\n                content = gzip.GzipFile(fileobj=buffered) if buffered.peek(2)[:2] == b'\\x1f\\x8b' else buffered\n                digest = hashlib.file_digest(content, 'sha256').hexdigest()\n                actual.append('sha256:'+digest)\n        if actual != expected:\n            raise ValueError('Image layer content differs from configuration')\n        config_digest = 'sha256:'+hashlib.sha256(config_bytes).hexdigest()\n        if 'index.json' in names:\n            with regular('index.json', 1024*1024) as stream:\n                index = json.load(stream)\n            descriptors = index.get('manifests', [])\n            if index.get('schemaVersion') != 2 or len(descriptors) != 1:\n                raise ValueError('Expected one OCI image descriptor')\n            descriptor = descriptors[0]\n            annotations = descriptor.get('annotations', {})\n            allowed_names = {\n                'io.containerd.image.name': ('adt-validation:ci', 'docker.io/library/adt-validation:ci'),\n                'org.opencontainers.image.ref.name': ('ci', 'adt-validation:ci', 'docker.io/library/adt-validation:ci'),\n            }\n            if any(key in annotations and annotations[key] not in allowed for key, allowed in allowed_names.items()):\n                raise ValueError('OCI image tag differs from validated tag')\n            digest = descriptor.get('digest', '')\n            if (descriptor.get('mediaType') not in ('application/vnd.oci.image.manifest.v1+json',\n                    'application/vnd.docker.distribution.manifest.v2+json')\n                    or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest)):\n                raise ValueError('Unsupported OCI image descriptor')\n            with regular('blobs/sha256/'+digest[7:], 1024*1024) as stream:\n                metadata = stream.read()\n            if len(metadata) != descriptor.get('size') or 'sha256:'+hashlib.sha256(metadata).hexdigest() != digest:\n                raise ValueError('OCI manifest content changed')\n            oci = json.loads(metadata)\n            if (image['Config'] != 'blobs/sha256/'+config_digest[7:]\n                    or layers != ['blobs/sha256/'+entry['digest'][7:] for entry in raw_layers]):\n                raise ValueError('OCI blobs differ from Docker archive members')\n            if (oci.get('schemaVersion') != 2 or oci.get('config', {}).get('digest') != config_digest\n                    or oci['config'].get('size') != len(config_bytes)\n                    or [{'digest':x.get('digest'), 'size':x.get('size')} for x in oci.get('layers', [])] != raw_layers):\n                raise ValueError('OCI descriptor differs from Docker archive identity')\n        return {'config': 'sha256:'+hashlib.sha256(config_bytes).hexdigest(), 'layers': actual}\n\nexpected = archive_identity(archive)\nsubprocess.run(['docker', 'load', '-i', str(archive)], check=True)\nlocal_id = subprocess.check_output(['docker', 'image', 'inspect', 'adt-validation:ci', '--format', '{{.Id}}'], text=True).strip()\nimport tempfile\nwith tempfile.TemporaryDirectory(prefix='adt-loaded-', dir=os.environ['RUNNER_TEMP']) as temporary:\n    loaded = Path(temporary) / 'loaded.tar'\n    subprocess.run(['docker', 'save', '-o', str(loaded), 'adt-validation:ci'], check=True)\n    observed = archive_identity(loaded)\nif observed != expected:\n    raise SystemExit('ADT: loaded image content differs from validated image')\nif subprocess.check_output(['docker', 'image', 'inspect', 'adt-validation:ci', '--format', '{{.Id}}'], text=True).strip() != local_id:\n    raise SystemExit('ADT: loaded image tag changed during verification')\nprint('ADT: verified portable image configuration ' + expected['config'])\nsubprocess.run(['docker', 'tag', local_id, os.environ['IMAGE'] + ':' + os.environ['GITHUB_SHA']], check=True)\nPY"}
      - name: Push verified image
        run: docker push "$IMAGE:$GITHUB_SHA"
      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          repository: sean-lpx/autonomous-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Update test deployment image
        shell: bash
        working-directory: gitops
        run: |
          set -euo pipefail
          latest_release="$(python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/release', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)['object']['sha'])
          PY
          )"
          test -n "$latest_release"
          if [ "$latest_release" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded release: $GITHUB_SHA"
            exit 0
          fi
          published_ref="$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          export IMAGE_DIGEST="${published_ref##*@}"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("apps/sean-adt-memos-39070bfc/overlays/test/kustomization.yaml")
          original = path.read_text()
          updated, count = re.subn(r"(?m)^([ \t]*digest:[ \t]*)sha256:[0-9a-f]{64}[ \t]*$",
                                  lambda m: m.group(1) + os.environ['IMAGE_DIGEST'], original)
          if count != 1:
              raise SystemExit('Expected exactly one image digest')
          path.write_text(updated)
          PY
          file="apps/sean-adt-memos-39070bfc/overlays/test/kustomization.yaml"
          if git diff --quiet -- "$file"; then
            echo "GitOps already references this image."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          git commit -m "deploy(memos): ${GITHUB_SHA}" -m "Source: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Other projects may update this shared branch at the same time.
          # Rebase preserves their unrelated paths; a conflict stops publication.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Clean downloaded artifact
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/adt-artifact"

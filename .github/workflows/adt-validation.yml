{
  "name": "ADT validation",
  "on": {
    "pull_request": {
      "branches": [
        "release"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "name": "ADT validation",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "uses": "actions/setup-go@v6",
          "with": {
            "go-version": "1.27.0"
          }
        },
        {
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "11.0.1",
            "package_json_file": "web/package.json"
          }
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "24.21.0"
          }
        },
        {
          "name": "Run project checks",
          "run": "python3 .adt/test.py"
        },
        {
          "name": "Build source image",
          "run": "python3 .adt/runtime.py build --image adt-validation:ci"
        },
        {
          "name": "Verify container and dependencies",
          "run": "python3 .adt/runtime.py smoke --image adt-validation:ci"
        },
        {
          "name": "Clean disposable resources",
          "if": "always()",
          "run": "python3 .adt/runtime.py cleanup"
        },
        {
          "name": "Export verified image",
          "id": "export",
          "run": "python3 - <<'PY'\nimport hashlib, json, os, subprocess\nfrom pathlib import Path\nout = Path(os.environ['RUNNER_TEMP']) / 'adt-artifact'\nout.mkdir()\nsubprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)\nsource = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()\ntree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()\nif source != os.environ['GITHUB_SHA']:\n    raise SystemExit('ADT: validation checkout differs from event source')\nevent = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())\npr = event.get('pull_request') or {}\narchive = out / 'image.tar'\nsubprocess.run(['docker', 'save', '-o', str(archive), 'adt-validation:ci'], check=True)\nwith archive.open('rb') as stream:\n    checksum = hashlib.file_digest(stream, 'sha256').hexdigest()\nimage_id = subprocess.check_output(['docker', 'image', 'inspect', 'adt-validation:ci', '--format', '{{.Id}}'], text=True).strip()\n(out / 'manifest.json').write_text(json.dumps({'version': 2, 'source': source, 'tree': tree,\n    'repository': os.environ['GITHUB_REPOSITORY'], 'repo_id': os.environ['GITHUB_REPOSITORY_ID'],\n    'workflow': os.environ['GITHUB_WORKFLOW_REF'], 'job': os.environ['GITHUB_JOB'],\n    'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'run': os.environ['GITHUB_RUN_ID'],\n    'event': os.environ['GITHUB_EVENT_NAME'], 'pr': str(pr.get('number', '')),\n    'base_ref': pr.get('base', {}).get('ref', os.environ['GITHUB_REF_NAME']),\n    'head': pr.get('head', {}).get('sha', source), 'image_id': image_id, 'sha256': checksum}))\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as stream:\n    for key, value in {'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'source': source, 'tree': tree,\n        'name': 'adt-image-' + tree + '-' + source + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']}.items():\n        stream.write(key + '=' + value + '\\n')\nPY"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "id": "artifact",
          "with": {
            "name": "${{ steps.export.outputs.name }}",
            "path": "${{ runner.temp }}/adt-artifact/",
            "retention-days": 7,
            "if-no-files-found": "error",
            "compression-level": 0
          }
        }
      ],
      "outputs": {
        "artifact": "${{ steps.artifact.outputs.artifact-id }}",
        "attempt": "${{ steps.export.outputs.attempt }}"
      }
    }
  }
}
